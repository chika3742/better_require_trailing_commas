name: better_require_trailing_commas
description: A lint rule that enforces trailing commas behaves like ESLint’s comma-dangle with the always-multiline option.
version: 2.5.5
repository: https://github.com/chika3742/better_require_trailing_commas

environment:
  sdk: ^3.10.0

dependencies:
  meta: ^1.17.0
  analyzer: ">=14.1.0 <15.0.0"
  analysis_server_plugin: ^0.3.20

dev_dependencies:
  analyzer_testing: ^0.3.4
  lints: ^6.0.0
  test_reflective_loader: ^0.4.0
